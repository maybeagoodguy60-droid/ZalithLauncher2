name: Build APK

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["all", "arm", "arm64", "x86", "x86_64"]
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Build APK for ${{ matrix.arch }}
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assemble${{ inputs.variant }} -Darch=${{ matrix.arch }}

      - name: Upload Release APK for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release apk (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/apk/release/*.apk

      - name: Upload Release Mapping for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mapping (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/mapping/release/mapping.txt

      - name: Upload Debug APK for ${{ matrix.arch }}
        if: inputs.variant == 'Debug'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: debug apk (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/apk/debug/*.apk

      - name: Compress Debug APK (arm64)
        if: inputs.variant == 'Debug' && matrix.arch == 'arm64'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          apk=$(ls ZalithLauncher/build/outputs/apk/debug/*.apk | head -1)
          mkdir -p dist
          echo "APK size: $(stat -c%s "$apk") bytes"
          cp "$apk" "dist/Aether-Launcher-arm64-Debug.apk"
          if command -v zip >/dev/null; then
            zip -9 -j "dist/Aether-Launcher-arm64-Debug.zip" "$apk"
          fi
          if command -v 7z >/dev/null; then
            7z a -tzip -mx=9 -mmt=on "dist/Aether-Launcher-arm64-Debug-max.zip" "$apk" >/dev/null
          fi
          if command -v xz >/dev/null; then
            xz -9e -c "$apk" > "dist/Aether-Launcher-arm64-Debug.apk.xz"
          fi
          if command -v zstd >/dev/null; then
            zstd --ultra -22 -q -f "dist/Aether-Launcher-arm64-Debug.apk" -o "dist/Aether-Launcher-arm64-Debug.apk.zst"
          fi
          ls -la dist

      - name: Upload Compressed ZIP (arm64)
        if: inputs.variant == 'Debug' && matrix.arch == 'arm64'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: debug apk arm64 (compressed)
          path: dist/
